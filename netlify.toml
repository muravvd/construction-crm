[build]
  command = "npm run build"
  publish = "dist"

# Одностраничное приложение: любые адреса (/tasks/123 и т.п.) отдают index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
